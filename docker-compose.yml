version: '3.8'
services:
  postgres:
    container_name: shopify_marketing_ai_db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopify_marketing_ai
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: shopify_marketing_ai_redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: shopify_marketing_ai_backend
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shopify_marketing_ai
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    container_name: shopify_marketing_ai_worker
    build: ./backend
    command: npm run start:worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shopify_marketing_ai
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: shopify_marketing_ai_frontend
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - path: ./frontend/.env.local
        required: false
    depends_on:
      - backend

volumes:
  postgres_data:
