# Railway Configuration for Shopify Marketing AI Platform
# This configuration is for deploying the backend service
# For multi-service deployment, use separate Railway services

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install && npx prisma generate && npm run build"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables (set via Railway dashboard)
# Required variables:
# - DATABASE_URL: PostgreSQL connection string (provided by Railway Postgres plugin)
# - REDIS_URL: Redis connection string (provided by Railway Redis plugin)
# - API_KEY: Your secure API key for authentication
# - NODE_ENV: production
# - PORT: Will be set automatically by Railway
# - FRONTEND_URL: Your frontend deployment URL
# - GEMINI_API_KEY: Google Gemini API key for AI features
# - AWS_ACCESS_KEY_ID: AWS credentials for SES
# - AWS_SECRET_ACCESS_KEY: AWS credentials for SES
# - AWS_REGION: AWS region for SES
# - SES_FROM_EMAIL: Verified sender email for SES
